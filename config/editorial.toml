# ChatGPT OAuth / Codex editorial enrichment. No Platform API key is used.
enabled = true
codex_path = "/Users/jh/.codex/plugins/.plugin-appserver/codex"
model = "gpt-5.6-luna"
reasoning_effort = "low"
call_timeout_seconds = 90
humanizer_skill_path = "/Users/jh/.codex/skills/humanizer/SKILL.md"
kenny_voice_path = "00_Governance/KENNY_VOICE_FINGERPRINT.md"
recent_reply_opener_limit = 12

# Bounded editorial budget. This is ChatGPT/Codex subscription usage, not paid X API traffic.
budget_revision = "distribution-opportunity-v8"
notification_epoch = "2026-09-15T10:12:50Z"
max_gate_calls_per_day = 80
max_final_calls_per_day = 50
max_humanize_calls_per_day = 50
max_tokens_per_day = 2100000
gate_token_reserve = 6000
final_token_reserve = 30000
humanize_token_reserve = 5000

# Only P0 may bypass the cheap editorial gate.
p0_direct_final_min_score = 10

# Only POST/REPLY editorial packets are sent. SKIP is stored silently.
send_skip_to_feishu = false
render_editorial_cards = true

# Operator-notification policy. These are attention-protection ceilings, NOT publishing quotas.
p0_min_confidence = 0.75
p1_min_confidence = 0.88
p1_post_min_confidence = 0.80
p1_post_min_score = 10
p1_reply_min_score = 6
max_post_packets_per_day = 2
max_p1_post_packets_per_day = 2
p1_reply_window_hours = 4
max_p1_reply_packets_per_window = 3
max_p1_reply_packets_per_day = 12

# Creator diversity: broaden audience reach instead of repeatedly replying to the same accounts.
p1_creator_cooldown_hours = 24
creator_hard_cooldown_hours = 6
max_p1_replies_per_creator_7d = 3
creator_hard_weekly_cap = 5
creator_recent_penalty_points = 2
creator_weekly_penalty_points = 1

# User availability and a coherent Chinese acquisition audience (2026-09-20).
operator_aware_policy = true
operator_timezone = "Asia/Shanghai"
operator_active_start = "08:00"
operator_active_end = "22:00"
reply_max_age_minutes = 180
original_source_max_age_minutes = 720
reply_min_observed_views = 300
reply_min_distribution_score = 4
max_reply_packets_per_day = 10
# Final drafting includes the full Humanizer self-audit; a separate rewrite is only a repair.
humanize_only_on_violation = true
