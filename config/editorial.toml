# ChatGPT OAuth / Codex editorial enrichment. No Platform API key is used.
enabled = true
codex_path = "/Users/jh/.codex/plugins/.plugin-appserver/codex"
model = "gpt-5.6-luna"
reasoning_effort = "low"
call_timeout_seconds = 90

# Reply-first quota. This is ChatGPT/Codex subscription usage, not paid X API traffic.
budget_revision = "dual-group-opinion-value-v1"
max_gate_calls_per_day = 8
max_final_calls_per_day = 5
max_tokens_per_day = 180000
gate_token_reserve = 6000
final_token_reserve = 30000

# Only P0 may bypass the cheap editorial gate.
p0_direct_final_min_score = 10

# Only POST/REPLY editorial packets are sent. SKIP is stored silently.
send_skip_to_feishu = false
render_editorial_cards = true

# Operator-notification policy. P0 is immediate; P1 is curated to match Stage-A output targets.
p0_min_confidence = 0.75
p1_min_confidence = 0.88
p1_post_min_score = 10
p1_reply_min_score = 7
max_post_packets_per_day = 1
max_reply_packets_per_day = 4
max_a_reply_packets_per_day = 2
max_b_reply_packets_per_day = 2
max_p1_post_packets_per_day = 1
max_p1_reply_packets_per_day = 4
